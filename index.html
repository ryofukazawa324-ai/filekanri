></div></div></div><script>const DB='pdf-local-library-v1';let db,docs=[],folders=[],urls=[],targetParent=null,targetFolder=null,editId=null,$=s=>document.querySelector(s),E=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function odb(){return new Promise((o,n)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'id'});if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'})};r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}let S=(n,m='readonly')=>db.transaction(n,m).objectStore(n),all=n=>new Promise(o=>{let r=S(n).getAll();r.onsuccess=()=>o(r.result)}),put=(n,x)=>new Promise((o,e)=>{let r=S(n,'readwrite').put(x);r.onsuccess=o;r.onerror=()=>e(r.error)}),del=(n,id)=>new Promise((o,e)=>{let r=S(n,'readwrite').delete(id);r.onsuccess=o;r.onerror=()=>e(r.error)});async function load(){docs=await all('docs');folders=await all('folders');render()}function u(b){let x=URL.createObjectURL(b);urls.push(x);return x}function clean(){urls.forEach(URL.revokeObjectURL);urls=[]}function tile(d){let x=u(d.blob),p=d.type==='image'?`<img src="${x}">`:`<iframe src="${x}#page=1&toolbar=0"></iframe><span class="tag">PDF</span>`;return `<button class="doc" data-d="${d.id}"><div class="pv">${p}</div><div class="dn">${E(d.title)}</div></button>`}function tiles(fid,q=''){let a=docs.filter(d=>d.folderId===fid&&(!q||d.title.toLowerCase().includes(q)));return `<div class="tiles">${a.map(tile).join('')}<button class="addtile" data-file="${fid}">＋</button></div>`}function desc(id,q){let f=folders.find(x=>x.id===id);return !!(f&&f.name.toLowerCase().includes(q))||docs.some(d=>d.folderId===id&&d.title.toLowerCase().includes(q))||folders.filter(x=>x.parent===id).some(k=>desc(k.id,q))}function sub(f,q){if(q&&!desc(f.id,q))return'';let k=folders.filter(x=>x.parent===f.id).filter(x=>!q||desc(x.id,q));return `<div class=
