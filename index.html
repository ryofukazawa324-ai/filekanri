<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>資料庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:max(14px,env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:5}.head{display:flex;align-items:center}.head h1{margin:0;flex:1;font-size:20px}.top{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:9px}.wrap{max-width:760px;margin:auto;padding:12px 12px 110px}.search{width:100%;padding:13px;border:0;border-radius:14px;font-size:16px}.bar{display:flex;align-items:center;gap:8px;margin:16px 0 9px}.bar h2{margin:0;flex:1;font-size:21px}.small{border:0;border-radius:10px;padding:9px 11px;font-weight:700}.tree{display:grid;gap:8px}.node{position:relative}.nodebox{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:10px 11px;box-shadow:0 1px 4px #0001}.toggle{border:0;background:none;font-size:16px;width:25px;padding:5px 0}.fname{border:0;background:none;text-align:left;font-size:15px;font-weight:800;flex:1;padding:7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quickadd{border:0;background:#111827;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.subadd{border:0;background:#e5e7eb;border-radius:9px;padding:8px 9px;font-weight:800}.children{margin-left:18px;padding-left:12px;border-left:2px solid #d1d5db;margin-top:7px;display:grid;gap:7px}.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:7px}.doc{border:0;background:#fff;border-radius:13px;text-align:left;padding:6px;overflow:hidden;box-shadow:0 1px 4px #0001}.pv{height:105px;border-radius:9px;overflow:hidden;background:#e5e7eb;position:relative}.pv img{width:100%;height:100%;object-fit:cover}.pv iframe{width:200%;height:200%;border:0;pointer-events:none;transform:scale(.5);transform-origin:top left;background:#fff}.tag{position:absolute;left:5px;bottom:5px;background:#111d;color:#fff;border-radius:5px;padding:2px 4px;font-size:9px}.dn{font-size:12px;font-weight:700;padding:6px 2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:#6b7280;padding:35px}.fab{position:fixed;right:17px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#111827;color:#fff;padding:15px 18px;font-weight:800;box-shadow:0 5px 20px #0004}dialog{border:0;border-radius:20px;padding:0;width:min(92vw,470px)}dialog::backdrop{background:#0008}.dlg{padding:19px}.dlg h2{margin:0 0 13px}.dlg input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;margin-bottom:12px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800}.primary{background:#111827;color:#fff}.ghost{background:#e5e7eb}.wide{width:100%;margin:5px 0;padding:15px}.row{display:flex;gap:8px;justify-content:flex-end}.hint{font-size:12px;color:#6b7280;margin:8px 0}#viewer{position:fixed;inset:0;background:#111827;z-index:20;display:none;flex-direction:column}#vb{display:flex;gap:8px;align-items:center;color:#fff;padding:max(10px,env(safe-area-inset-top)) 10px 10px}#vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#viewer iframe{flex:1;width:100%;border:0;background:#fff}#viewer>img{flex:1;min-height:0;max-width:100%;object-fit:contain}.vbtn{border:0;border-radius:9px;padding:9px}</style></head><body><header><div class="head"><h1>資料庫</h1><button class="top" id="tr">⇄ 引き継ぎ</button></div></header><main class="wrap"><input id="q" class="search" placeholder="検索"><div class="bar"><h2>項目</h2><button class="small" id="rootAdd">＋ 項目</button></div><div id="app"></div></main><button class="fab" id="rootDoc">＋ 資料</button><input id="files" type="file" accept="application/pdf,image/*" multiple hidden><dialog id="fd"><form class="dlg" id="ff"><h2>項目を追加</h2><input id="fn" placeholder="項目名" required><div class="row"><button type="button" class="btn ghost" id="fc">閉じる</button><button class="btn primary">追加</button></div></form></dialog><dialog id="td"><div class="dlg"><h2>共有・引き継ぎ</h2><div id="stats" class="hint"></div><button class="btn primary wide" id="ex">↑ この端末から送る</button><button class="btn ghost wide" id="im">↓ この端末に読み込む</button><input id="imp" type="file" accept=".shiryoko,application/json" hidden><div id="st" class="hint"></div><button class="btn ghost wide" id="tc">閉じる</button></div></dialog><div id="viewer"><div id="vb"><button class="vbtn" id="vc">← 戻る</button><b id="vt"></b><button class="vbtn" id="vs">共有</button></div><iframe id="vp" hidden></iframe><img id="vi" hidden></div><script>const DB='pdf-local-library-v1';let db,docs=[],folders=[],urls=[],expanded=new Set(),targetParent=null,targetFolder=null,$=s=>document.querySelector(s),E=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function odb(){return new Promise((o,n)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'id'});if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'})};r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}let S=(n,m='readonly')=>db.transaction(n,m).objectStore(n),all=n=>new Promise(o=>{let r=S(n).getAll();r.onsuccess=()=>o(r.result)}),put=(n,x)=>new Promise((o,e)=>{let r=S(n,'readwrite').put(x);r.onsuccess=o;r.onerror=()=>e(r.error)});async function load(){docs=await all('docs');folders=await all('folders');await migrate();render()}async function migrate(){if(folders.length||!docs.some(x=>x.category))return;let m={};for(let d of docs){let a=d.category||'資料';if(!m[a]){let f={id:crypto.randomUUID(),name:a,parent:null};await put('folders',f);folders.push(f);m[a]=f.id}let p=m[a];if(d.subcat){let k=a+'/'+d.subcat;if(!m[k]){let f={id:crypto.randomUUID(),name:d.subcat,parent:p};await put('folders',f);folders.push(f);m[k]=f.id}p=m[k]}d.folderId=p;await put('docs',d)}}function u(b){let x=URL.createObjectURL(b);urls.push(x);return x}function clean(){urls.forEach(URL.revokeObjectURL);urls=[]}function dhtml(a){return a.length?'<div class="docs">'+a.map(d=>{let x=u(d.blob),p=d.type==='image'?`<img src="${x}">`:`<iframe src="${x}#page=1&toolbar=0"></iframe><span class="tag">PDF</span>`;return `<button class="doc" data-d="${d.id}"><div class="pv">${p}</div><div class="dn">${E(d.title)}</div></button>`}).join('')+'</div>':''}function node(f,q=''){let kids=folders.filter(x=>x.parent===f.id),ds=docs.filter(x=>x.folderId===f.id),open=expanded.has(f.id),match=!q||f.name.toLowerCase().includes(q)||ds.some(d=>d.title.toLowerCase().includes(q))||kids.some(k=>hasMatch(k,q));if(!match)return'';if(q)open=true;let inside=open?`<div class="children">${kids.map(k=>node(k,q)).join('')}${dhtml(ds.filter(d=>!q||d.title.toLowerCase().includes(q)))}</div>`:'';return `<div class="node"><div class="nodebox"><button class="toggle" data-toggle="${f.id}">${open?'▾':'▸'}</button><button class="fname" data-toggle="${f.id}">📁 ${E(f.name)}</button><button class="quickadd" data-file="${f.id}">＋資料</button><button class="subadd" data-sub="${f.id}">＋項目</button></div>${inside}</div>`}function hasMatch(f,q){return f.name.toLowerCase().includes(q)||docs.some(d=>d.folderId===f.id&&d.title.toLowerCase().includes(q))||folders.filter(x=>x.parent===f.id).some(k=>hasMatch(k,q))}function render(){clean();let q=$('#q').value.trim().toLowerCase(),roots=folders.filter(f=>f.parent===null||f.parent===undefined),loose=docs.filter(d=>!d.folderId&&(!q||d.title.toLowerCase().includes(q)));$('#app').innerHTML='<div class="tree">'+roots.map(f=>node(f,q)).join('')+'</div>'+dhtml(loose)+(roots.length||loose.length?'':'<div class="empty">「＋項目」で作成</div>')}function addFolder(parent){targetParent=parent;$('#fn').value='';$('#fd').showModal()}$('#rootAdd').onclick=()=>addFolder(null);$('#fc').onclick=()=>$('#fd').close();$('#ff').onsubmit=async e=>{e.preventDefault();let n=$('#fn').value.trim();if(n){let f={id:crypto.randomUUID(),name:n,parent:targetParent};await put('folders',f);if(targetParent)expanded.add(targetParent);folders=await all('folders');$('#fd').close();render()}};function pickFiles(folder){targetFolder=folder;if(folder)expanded.add(folder);$('#files').click()}$('#rootDoc').onclick=()=>pickFiles(null);$('#files').onchange=async()=>{for(let f of [...$('#files').files]){let img=f.type.startsWith('image/'),b=img?await comp(f):f;await put('docs',{id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),folderId:targetFolder,blob:b,type:img?'image':'pdf',size:b.size})}$('#files').value='';docs=await all('docs');render()};document.onclick=e=>{let t=e.target.closest('[data-toggle],[data-file],[data-sub],[data-d]');if(!t)return;if(t.dataset.toggle){expanded.has(t.dataset.toggle)?expanded.delete(t.dataset.toggle):expanded.add(t.dataset.toggle);render()}else if(t.dataset.file)pickFiles(t.dataset.file);else if(t.dataset.sub)addFolder(t.dataset.sub);else if(t.dataset.d)openDoc(t.dataset.d)};function comp(f){return new Promise((o,e)=>{let i=new Image,x=URL.createObjectURL(f);i.onload=()=>{let s=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(x);b?o(b):e()},'image/jpeg',.78)};i.onerror=e;i.src=x})}function openDoc(id){let d=docs.find(x=>x.id===id),x=URL.createObjectURL(d.blob);$('#viewer').dataset.url=x;$('#viewer').dataset.id=id;$('#vt').textContent=d.title;$('#viewer').style.display='flex';if(d.type==='image'){$('#vi').src=x;$('#vi').hidden=false;$('#vp').hidden=true}else{$('#vp').src=x;$('#vp').hidden=fa
