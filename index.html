<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>資料庫</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 14px}h1{font-size:20px;margin:0}.sub,.tiny{font-size:12px;color:#6b7280}header .sub{color:#fff9}.wrap{max-width:760px;margin:auto;padding:14px 14px 105px}.search{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;box-shadow:0 1px 5px #0001}.section{margin:20px 0 10px;font-weight:800}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cat,.card{background:#fff;border:0;border-radius:16px;padding:15px;text-align:left;box-shadow:0 1px 4px #0001}.cat b{display:block}.cat small{color:#6b7280}.list{display:grid;gap:8px}.card{display:flex;gap:11px;align-items:center;padding:12px}.icon{width:42px;height:48px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:900;flex:none;background:#e5e7eb}.pdf{background:#fee2e2;color:#b91c1c}.img{background:#dbeafe;color:#1d4ed8;font-size:20px}.meta{min-width:0;flex:1}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{border:0;background:none;font-size:21px}.danger{color:#b91c1c}.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#111827;color:#fff;padding:15px 18px;font-size:15px;font-weight:800;box-shadow:0 5px 20px #0004}dialog{border:0;border-radius:20px;width:min(94vw,560px);padding:0;max-height:90vh}dialog::backdrop{background:#0008}.dlg{padding:19px;overflow:auto;max-height:90vh}.dlg h2{margin:0 0 6px}.dlg input{width:100%;padding:12px;margin:5px 0 11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800}.primary{background:#111827;color:#fff}.ghost{background:#e5e7eb}.row{display:flex;gap:9px;align-items:center}.files{background:#f3f4f6;border-radius:12px;padding:9px 12px;margin:3px 0 12px;font-size:13px;max-height:140px;overflow:auto}.fileline{padding:5px 0;border-bottom:1px solid #ddd}.empty{text-align:center;color:#6b7280;padding:32px 10px}.back{border:0;background:none;padding:0;color:#374151}.hint{font-size:12px;color:#6b7280;margin-bottom:12px}.quick{display:flex;gap:7px;overflow:auto;margin:7px 0 12px}.chip{white-space:nowrap;border:0;border-radius:999px;padding:8px 11px;background:#e5e7eb}#viewer{position:fixed;inset:0;background:#111827;z-index:20;display:none;flex-direction:column}#viewerBar{padding:max(10px,env(safe-area-inset-top)) 10px 10px;color:#fff;display:flex;align-items:center;gap:10px}#viewer iframe{border:0;background:#fff;flex:1;width:100%}#viewer img{max-width:100%;max-height:calc(100vh - 60px);margin:auto;object-fit:contain;flex:1;min-height:0}.vbtn{border:0;border-radius:9px;padding:9px 12px}.grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{font-size:12px;font-weight:700;margin:8px 0;color:#374151}</style></head><body><header><h1>資料庫</h1><div class="sub">PDF・写真を端末内に保存</div></header><main class="wrap"><input id="search" class="search" placeholder="通信、Wi-Fi、テレビ、保証…"><div id="quick"></div><div id="breadcrumb"></div><div id="content"></div></main><button class="fab" id="add">＋ 資料追加</button><dialog id="dlg"><form class="dlg" id="form"><h2>資料をまとめて追加</h2><div class="hint">PDFと写真を一度に複数選択できます。写真は保存前に自動で軽量化します。</div><label><b>PDF / 写真</b></label><input id="file" type="file" accept="application/pdf,image/*" multiple required><div id="selected" class="files">まだ選択されていません</div><label><b>項目名</b></label><input id="category" list="catlist" placeholder="例：通信" required><datalist id="catlist"></datalist><label><b>小項目（任意）</b></label><input id="subcat" placeholder="例：Wi-Fi"><label><b>検索用キーワード（任意）</b></label><input id="tags" placeholder="例：ネット 無線 LAN"><div class="progress" id="progress"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="cancel">閉じる</button><button class="btn primary" id="save">まとめて保存</button></div></form></dialog><div id="viewer"><div id="viewerBar"><button class="vbtn" id="closev">← 戻る</button><b class="grow" id="vtitle"></b><button class="vbtn" id="sharev">共有</button></div><iframe id="frame" style="display:none"></iframe><img id="photo" style="display:none"></div><script>const DB='pdf-local-library-v1',STORE='docs';let db,all=[],view={cat:null,sub:null};const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),size=n=>n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function tx(m='readonly'){return db.transaction(STORE,m).objectStore(STORE)}function load(){return new Promise(ok=>{let r=tx().getAll();r.onsuccess=()=>{all=r.result.sort((a,b)=>b.lastOpened-a.lastOpened);render();ok()}})}function cards(ds){return ds.length?'<div class="list">'+ds.map(x=>`<div class="card" data-open="${x.id}"><div class="icon ${x.type==='image'?'img':'pdf'}">${x.type==='image'?'▧':'PDF'}</div><div class="meta"><div class="name">${esc(x.title)}</div><div class="tiny">${esc(x.category)}${x.subcat?' › '+esc(x.subcat):''} ・ ${size(x.size)}</div></div><button class="star" data-star="${x.id}">${x.favorite?'★':'☆'}</button><button class="star danger" data-del="${x.id}">⋯</button></div>`).join('')+'</div>':'<div class="empty">資料がありません</div>'}function render(){let q=$('#search').value.trim().toLowerCase(),docs=all.filter(x=>!q||[x.title,x.category,x.subcat,x.tags].join(' ').toLowerCase().includes(q)),cats=[...new Set(all.map(x=>x.category))];$('#catlist').innerHTML=cats.map(x=>`<option value="${esc(x)}">`).join('');$('#quick').innerHTML=!q&&cats.length?'<div class="quick">'+cats.slice(0,8).map(x=>`<button class="chip" data-search="${esc(x)}">${esc(x)}</button>`).join('')+'</div>':'';let c=$('#content'),bc=$('#breadcrumb');if(q){bc.innerHTML='';c.innerHTML=`<div class="section">「${esc(q)}」の検索結果 ${docs.length}件</div>`+cards(docs);return}if(!view.cat){bc.innerHTML='';let fav=docs.filter(x=>x.favorite);c.innerHTML=(fav.length?'<div class="section">★ よく使う</div>'+cards(fav.slice(0,5)):'')+'<div class="section">項目</div><div class="cats">'+cats.map(x=>`<button class="cat" data-cat="${esc(x)}"><b>📁 ${esc(x)}</b><small>${docs.filter(d=>d.category===x).length}件</small></button>`).join('')+'</div>'+(docs.length?'<div class="section">最近使った</div>'+cards(docs.slice(0,6)):'<div class="empty">「＋資料追加」からPDFや写真を追加できます。</div>')}else if(!view.sub){bc.innerHTML='<div class="section"><button class="back" data-home>← 項目一覧</button></div>';let ds=docs.filter(x=>x.category===view.cat),subs=[...new Set(ds.map(x=>x.subcat||'その他'))];c.innerHTML=`<h2>${esc(view.cat)}</h2><div class="cats">`+subs.map(x=>`<button class="cat" data-sub="${esc(x)}"><b>📂 ${esc(x)}</b><small>${ds.filter(d=>(d.subcat||'その他')===x).length}件</small></button>`).join('')+'</div><div class="section">全部</div>'+cards(ds)}else{bc.innerHTML=`<div class="section"><button class="back" data-cat="${esc(view.cat)}">← ${esc(view.cat)}</button></div>`;let ds=docs.filter(x=>x.category===view.cat&&(x.subcat||'その他')===view.sub);c.innerHTML=`<h2>${esc(view.sub)}</h2>`+cards(ds)}}document.addEventListener('click',async e=>{let el=e.target.closest('[data-search],[data-cat],[data-sub],[data-home],[data-open],[data-star],[data-del]');if(!el)return;if(el.dataset.search){$('#search').value=el.dataset.search;render()}else if(el.dataset.home!==undefined){view={cat:null,sub:null};render()}else if(el.dataset.cat){view={cat:el.dataset.cat,sub:null};render()}else if(el.dataset.sub){view.sub=el.dataset.sub;render()}else if(el.dataset.star){e.stopPropagation();let x=all.find(d=>d.id===el.dataset.star);x.favorite=!x.favorite;tx('readwrite').put(x);render()}else if(el.dataset.del){e.stopPropagation();let x=all.find(d=>d.id===el.dataset.del);if(confirm(`「${x.title}」を削除しますか？`)){tx('readwrite').delete(x.id);await load()}}else openItem(el.dataset.open)});function openItem(id){let x=all.find(d=>d.id===id);x.lastOpened=Date.now();tx('readwrite').put(x);let u=URL.createObjectURL(x.blob);$('#vtitle').textContent=x.title;$('#viewer').style.display='flex';$('#viewer').dataset.url=u;$('#viewer').dataset.id=id;if(x.type==='image'){$('#photo').src=u;$('#photo').style.display='block';$('#frame').style.display='none'}else{$('#frame').src=u;$('#frame').style.display='block';$('#photo').style.display='none'}}$('#closev').onclick=()=>{$('#frame').src='about:blank';$('#photo').src='';URL.revokeObjectURL($('#viewer').dataset.url);$('#viewer').style.display='none';load()};$('#sharev').onclick=async()=>{let x=all.find(d=>d.id===$('#viewer').dataset.id),ext=x.type==='image'?'.jpg':'.pdf',f=new File([x.blob],x.title+ext,{type:x.blob.type});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:x.title})};function compressImage(file){return new Promise((resolve,reject)=>{let img=new Image,u=URL.createObjectURL(file);img.onload=()=>{let max=1800,w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(b):reject(new Error('圧縮失敗'))},'image/jpeg',.78)};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('画像読込失敗'))};img.src=u})}$('#add').onclick=()=>{$('#category').value=view.cat||'';$('#subcat').value=view.sub||'';$('#dlg').showModal()};$('#cancel').onclick=()=>$('#dlg').close();$('#file').onchange=()=>{let fs=[...$('#file').files];$('#selected').innerHTML=fs.length?`<b>${fs.length}件選択</b>`+fs.map(f=>`<div class="fileline">${f.type.startsWith('image/')?'📷':'📄'} ${esc(f.name)} <span class="tiny">${size(f.size)}</span></div>`).join(''):'まだ選択されていません'};$('#form').onsubmit=async e=>{e.preventDefault();let fs=[...$('#file').files],cat=$('#category').value.trim(),sub=$('#subcat').value.trim(),tags=$('#tags').value.trim();if(!fs.length||!cat)return;$('#save').disabled=true;try{for(let i=0;i<fs.length;i++){let f=fs[i],isImg=f.type.startsWith('image/');$('#progress').textContent=`${i+1}/${fs.length} を処理中${isImg?'（写真を圧縮中）':''}…`;let blob=isImg?await compressImage(f):f;await new Promise((ok,no)=>{let r=tx('readwrite').put({id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),category:cat,subcat:sub,tags,size:blob.size,originalSize:f.size,blob,type:isImg?'image':'pdf',favorite:false,created:Date.now()+i,lastOpened:Date.now()+i});r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}$('#form').reset();$('#selected').textContent='まだ選択されていません';$('#progress').textContent='保存しました';$('#dlg').close();await load()}catch(err){alert('保存中にエラーが発生しました: '+err.message)}finally{$('#save').disabled=false;setTimeout(()=>$('#progress').textContent='',1200)}};$('#search').oninput=render;(async()=>{db=await openDB();await load();navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')})();</script></body></html>
