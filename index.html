<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>資料庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:max(14px,env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:5}.head{display:flex;align-items:center}.head h1{margin:0;flex:1;font-size:20px}.top{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:9px}.wrap{max-width:760px;margin:auto;padding:12px 12px 110px}.search{width:100%;padding:13px;border:0;border-radius:14px;font-size:16px}.bar{display:flex;align-items:center;gap:8px;margin:16px 0 9px}.bar h2{margin:0;flex:1;font-size:21px}.small{border:0;border-radius:10px;padding:9px 11px;font-weight:700}.folders,.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.folder,.doc{border:0;background:#fff;border-radius:15px;text-align:left;box-shadow:0 1px 4px #0001}.folder{padding:15px}.folder b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder small{color:#6b7280}.doc{padding:7px;overflow:hidden}.pv{height:125px;border-radius:10px;overflow:hidden;background:#e5e7eb;position:relative}.pv img{width:100%;height:100%;object-fit:cover}.pv iframe{width:200%;height:200%;border:0;pointer-events:none;transform:scale(.5);transform-origin:top left;background:#fff}.tag{position:absolute;left:6px;bottom:6px;background:#111d;color:#fff;border-radius:6px;padding:3px 5px;font-size:10px}.dn{font-size:13px;font-weight:700;padding:7px 3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{font-size:13px;font-weight:800;margin:18px 2px 8px}.back{border:0;background:none;padding:0;margin-top:14px;font-weight:700}.empty{text-align:center;color:#6b7280;padding:35px}.fab{position:fixed;right:17px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#111827;color:#fff;padding:15px 18px;font-weight:800;box-shadow:0 5px 20px #0004}dialog{border:0;border-radius:20px;padding:0;width:min(92vw,470px)}dialog::backdrop{background:#0008}.dlg{padding:19px}.dlg h2{margin:0 0 13px}.dlg input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;margin-bottom:12px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800}.primary{background:#111827;color:#fff}.ghost{background:#e5e7eb}.wide{width:100%;margin:5px 0;padding:15px}.row{display:flex;gap:8px;justify-content:flex-end}.hint{font-size:12px;color:#6b7280;margin:8px 0}#viewer{position:fixed;inset:0;background:#111827;z-index:20;display:none;flex-direction:column}#vb{display:flex;gap:8px;align-items:center;color:#fff;padding:max(10px,env(safe-area-inset-top)) 10px 10px}#vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#viewer iframe{flex:1;width:100%;border:0;background:#fff}#viewer>img{flex:1;min-height:0;max-width:100%;object-fit:contain}.vbtn{border:0;border-radius:9px;padding:9px}</style></head><body><header><div class="head"><h1>資料庫</h1><button class="top" id="tr">⇄ 引き継ぎ</button></div></header><main class="wrap"><input id="q" class="search" placeholder="検索"><div id="app"></div></main><button class="fab" id="addDoc">＋ 資料</button><input id="files" type="file" accept="application/pdf,image/*" multiple hidden><dialog id="fd"><form class="dlg" id="ff"><h2>項目を追加</h2><input id="fn" placeholder="項目名" required><div class="row"><button type="button" class="btn ghost" id="fc">閉じる</button><button class="btn primary">追加</button></div></form></dialog><dialog id="td"><div class="dlg"><h2>共有・引き継ぎ</h2><div id="stats" class="hint"></div><button class="btn primary wide" id="ex">↑ この端末から送る</button><button class="btn ghost wide" id="im">↓ この端末に読み込む</button><input id="imp" type="file" accept=".shiryoko,application/json" hidden><div id="st" class="hint"></div><button class="btn ghost wide" id="tc">閉じる</button></div></dialog><div id="viewer"><div id="vb"><button class="vbtn" id="vc">← 戻る</button><b id="vt"></b><button class="vbtn" id="vs">共有</button></div><iframe id="vp" hidden></iframe><img id="vi" hidden></div><script>const DB='pdf-local-library-v1';let db,docs=[],folders=[],cur=null,urls=[],$=s=>document.querySelector(s),E=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function odb(){return new Promise((o,n)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'id'});if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'})};r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}let S=(n,m='readonly')=>db.transaction(n,m).objectStore(n),all=n=>new Promise(o=>{let r=S(n).getAll();r.onsuccess=()=>o(r.result)}),put=(n,x)=>new Promise((o,e)=>{let r=S(n,'readwrite').put(x);r.onsuccess=o;r.onerror=()=>e(r.error)});async function load(){docs=await all('docs');folders=await all('folders');await migrate();render()}async function migrate(){if(folders.length||!docs.some(x=>x.category))return;let m={};for(let d of docs){let a=d.category||'資料';if(!m[a]){let f={id:crypto.randomUUID(),name:a,parent:null};await put('folders',f);folders.push(f);m[a]=f.id}let p=m[a];if(d.subcat){let k=a+'/'+d.subcat;if(!m[k]){let f={id:crypto.randomUUID(),name:d.subcat,parent:p};await put('folders',f);folders.push(f);m[k]=f.id}p=m[k]}d.folderId=p;await put('docs',d)}}function u(b){let x=URL.createObjectURL(b);urls.push(x);return x}function clean(){urls.forEach(URL.revokeObjectURL);urls=[]}function fhtml(a){return a.length?'<div class="folders">'+a.map(f=>`<button class="folder" data-f="${f.id}"><b>📁 ${E(f.name)}</b><small>${folders.filter(x=>x.parent===f.id).length+docs.filter(x=>x.folderId===f.id).length}件</small></button>`).join('')+'</div>':''}function dhtml(a){return a.length?'<div class="docs">'+a.map(d=>{let x=u(d.blob),p=d.type==='image'?`<img src="${x}">`:`<iframe src="${x}#page=1&toolbar=0"></iframe><span class="tag">PDF</span>`;return `<button class="doc" data-d="${d.id}"><div class="pv">${p}</div><div class="dn">${E(d.title)}</div></button>`}).join('')+'</div>':''}function render(){clean();let q=$('#q').value.trim().toLowerCase();if(q){let fs=folders.filter(f=>f.name.toLowerCase().includes(q)),ds=docs.filter(d=>[d.title,d.category,d.subcat,d.tags].join(' ').toLowerCase().includes(q));$('#app').innerHTML='<div class="section">検索結果</div>'+fhtml(fs)+dhtml(ds);return}let fs=folders.filter(f=>f.parent===cur),ds=docs.filter(d=>d.folderId===cur||(!d.folderId&&!cur)),f=folders.find(x=>x.id===cur);$('#app').innerHTML=(cur?`<button class="back" id="up">← 戻る</button>`:'')+`<div class="bar"><h2>${f?E(f.name):'項目'}</h2><button class="small" id="af">＋ 項目</button></div>`+fhtml(fs)+(ds.length?'<div class="section">資料</div>'+dhtml(ds):(!fs.length?'<div class="empty">項目を作るか、資料を追加</div>':''));$('#af').onclick=()=>{$('#fn').value='';$('#fd').showModal()};$('#up')&&($('#up').onclick=()=>{cur=f?.parent||null;render()})}document.onclick=e=>{let f=e.target.closest('[data-f]'),d=e.target.closest('[data-d]');if(f){cur=f.dataset.f;render()}else if(d)openDoc(d.dataset.d)};$('#fc').onclick=()=>$('#fd').close();$('#ff').onsubmit=async e=>{e.preventDefault();let n=$('#fn').value.trim();if(n){await put('folders',{id:crypto.randomUUID(),name:n,parent:cur});folders=await all('folders');$('#fd').close();render()}};$('#addDoc').onclick=()=>$('#files').click();$('#files').onchange=async()=>{for(let f of [...$('#files').files]){let img=f.type.startsWith('image/'),b=img?await comp(f):f;await put('docs',{id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),folderId:cur,blob:b,type:img?'image':'pdf',size:b.size})}$('#files').value='';docs=await all('docs');render()};function comp(f){return new Promise((o,e)=>{let i=new Image,x=URL.createObjectURL(f);i.onload=()=>{let s=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(x);b?o(b):e()},'image/jpeg',.78)};i.src=x})}function openDoc(id){let d=docs.find(x=>x.id===id),x=URL.createObjectURL(d.blob);$('#viewer').dataset.url=x;$('#viewer').dataset.id=id;$('#vt').textContent=d.title;$('#viewer').style.display='flex';if(d.type==='image'){$('#vi').src=x;$('#vi').hidden=false;$('#vp').hidden=true}else{$('#vp').src=x;$('#vp').hidden=false;$('#vi').hidden=true}}$('#vc').onclick=()=>{URL.revokeObjectURL($('#viewer').dataset.url);$('#vp').src='about:blank';$('#vi').src='';$('#viewer').style.display='none'};$('#vs').onclick=async()=>{let d=docs.find(x=>x.id===$('#viewer').dataset.id),f=new File([d.blob],d.title+(d.type==='image'?'.jpg':'.pdf'),{type:d.blob.type});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]})};$('#q').oninput=render;let b64=async b=>{let a=new Uint8Array(await b.arrayBuffer()),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)},ub=(s,t)=>{let z=atob(s),a=new Uint8Array(z.length);for(let i=0;i<z.length;i++)a[i]=z.charCodeAt(i);return new Blob([a],{type:t})};$('#tr').onclick=()=>{$('#stats').textContent=`項目 ${folders.length} / 資料 ${docs.length}`;$('#td').showModal()};$('#tc').onclick=()=>$('#td').close();$('#ex').onclick=async()=>{let a=[];$('#st').textContent='作成中…';for(let d of docs)a.push({...d,blob:undefined,data:await b64(d.blob),mime:d.blob.type});let f=new File([JSON.stringify({app:'shiryoko',version:2,folders,docs:a})],`資料庫_${new Date().toISOString().slice(0,10)}.shiryoko`,{type:'application/json'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else{let x=URL.createObjectURL(f),a=document.createElement('a');a.href=x;a.download=f.name;a.click()}$('#st').textContent='完了'};$('#im').onclick=()=>$('#imp').click();$('#imp').onchange=async()=>{try{let x=JSON.parse(await $('#imp').files[0].text());for(let f of x.folders||[])await put('folders',f);for(let d of x.docs||[]){d.blob=ub(d.data,d.mime||'application/pdf');delete d.data;delete d.mime;await put('docs',d)}await load();$('#st').textContent='読み込み完了'}catch(e){alert('読み込みできませんでした')}};(async()=>{db=await odb();await load();navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')})();</script></body></html>
