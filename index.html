<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>資料庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:max(14px,env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:5}.head{display:flex;align-items:center}.head h1{margin:0;flex:1;font-size:20px}.top{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:10px;padding:9px}.wrap{max-width:1200px;margin:auto;padding:12px 14px 100px}.search{width:100%;padding:14px 16px;border:0;border-radius:14px;font-size:16px}.bar{display:flex;align-items:center;gap:8px;margin:16px 0 9px}.bar h2{margin:0;flex:1;font-size:21px}.small{border:0;border-radius:10px;padding:9px 11px;font-weight:800}.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}.board{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 5px #0001}.boardhead{display:flex;align-items:center;gap:7px;margin-bottom:10px}.boardname{font-weight:850;flex:1;border:0;background:none;text-align:left;font-size:16px;padding:5px 0}.mini{border:0;border-radius:8px;padding:7px 8px;background:#eef0f3;font-weight:750}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.doc,.addtile{aspect-ratio:3/4;border-radius:11px;overflow:hidden;position:relative}.doc{border:0;background:#eef0f3;padding:0;text-align:left}.pv{position:absolute;inset:0 0 24px;overflow:hidden;background:#e5e7eb}.pv img{width:100%;height:100%;object-fit:cover}.pv iframe{width:200%;height:200%;border:0;pointer-events:none;transform:scale(.5);transform-origin:top left;background:#fff}.tag{position:absolute;left:5px;bottom:5px;background:#111d;color:#fff;border-radius:5px;padding:2px 4px;font-size:9px}.dn{position:absolute;bottom:0;left:0;right:0;height:24px;background:#fff;padding:5px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.addtile{border:2px dashed #aeb4bd;background:transparent;color:#6b7280;font-size:27px;font-weight:300;display:grid;place-items:center}.subboards{margin-top:10px;padding-left:10px;border-left:2px solid #d8dce2;display:grid;gap:9px}.subboard{background:#f7f8fa;border-radius:12px;padding:9px}.subhead{display:flex;align-items:center;gap:6px;margin-bottom:7px}.subname{font-weight:800;flex:1;font-size:13px}.empty{text-align:center;color:#6b7280;padding:40px}.rootdocs{margin-top:14px;max-width:360px}.fab{position:fixed;right:17px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#111827;color:#fff;padding:15px 18px;font-weight:800;box-shadow:0 5px 20px #0004}dialog{border:0;border-radius:20px;padding:0;width:min(92vw,470px)}dialog::backdrop{background:#0008}.dlg{padding:19px}.dlg h2{margin:0 0 13px}.dlg input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;margin-bottom:12px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800}.primary{background:#111827;color:#fff}.ghost{background:#e5e7eb}.wide{width:100%;margin:5px 0;padding:15px}.row{display:flex;gap:8px;justify-content:flex-end}.hint{font-size:12px;color:#6b7280;margin:8px 0}#viewer{position:fixed;inset:0;background:#111827;z-index:20;display:none;flex-direction:column}#vb{display:flex;gap:8px;align-items:center;color:#fff;padding:max(10px,env(safe-area-inset-top)) 10px 10px}#vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#viewer iframe{flex:1;width:100%;border:0;background:#fff}#viewer>img{flex:1;min-height:0;max-width:100%;object-fit:contain}.vbtn{border:0;border-radius:9px;padding:9px}@media(max-width:600px){.boards{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="head"><h1>資料庫</h1><button class="top" id="tr">⇄ 引き継ぎ</button></div></header><main class="wrap"><input id="q" class="search" placeholder="検索"><div class="bar"><h2>項目</h2><button class="small" id="rootAdd">＋ 項目</button></div><div id="app"></div></main><button class="fab" id="rootDoc">＋ 資料</button><input id="files" type="file" accept="application/pdf,image/*" multiple hidden><dialog id="fd"><form class="dlg" id="ff"><h2>項目を追加</h2><input id="fn" placeholder="項目名" required><div class="row"><button type="button" class="btn ghost" id="fc">閉じる</button><button class="btn primary">追加</button></div></form></dialog><dialog id="td"><div class="dlg"><h2>共有・引き継ぎ</h2><div id="stats" class="hint"></div><button class="btn primary wide" id="ex">↑ この端末から送る</button><button class="btn ghost wide" id="im">↓ この端末に読み込む</button><input id="imp" type="file" accept=".shiryoko,application/json" hidden><div id="st" class="hint"></div><button class="btn ghost wide" id="tc">閉じる</button></div></dialog><div id="viewer"><div id="vb"><button class="vbtn" id="vc">← 戻る</button><b id="vt"></b><button class="vbtn" id="vs">共有</button></div><iframe id="vp" hidden></iframe><img id="vi" hidden></div><script>const DB='pdf-local-library-v1';let db,docs=[],folders=[],urls=[],targetParent=null,targetFolder=null,$=s=>document.querySelector(s),E=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function odb(){return new Promise((o,n)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'id'});if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'})};r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}let S=(n,m='readonly')=>db.transaction(n,m).objectStore(n),all=n=>new Promise(o=>{let r=S(n).getAll();r.onsuccess=()=>o(r.result)}),put=(n,x)=>new Promise((o,e)=>{let r=S(n,'readwrite').put(x);r.onsuccess=o;r.onerror=()=>e(r.error)});async function load(){docs=await all('docs');folders=await all('folders');render()}function u(b){let x=URL.createObjectURL(b);urls.push(x);return x}function clean(){urls.forEach(URL.revokeObjectURL);urls=[]}function tile(d){let x=u(d.blob),p=d.type==='image'?`<img src="${x}">`:`<iframe src="${x}#page=1&toolbar=0"></iframe><span class="tag">PDF</span>`;return `<button class="doc" data-d="${d.id}"><div class="pv">${p}</div><div class="dn">${E(d.title)}</div></button>`}function tiles(fid,q=''){let a=docs.filter(d=>d.folderId===fid&&(!q||d.title.toLowerCase().includes(q)));return `<div class="tiles">${a.map(tile).join('')}<button class="addtile" data-file="${fid||'root'}" aria-label="資料追加">＋</button></div>`}function descendants(id,q){let ds=docs.some(d=>d.folderId===id&&d.title.toLowerCase().includes(q));return folders.find(f=>f.id===id)?.name.toLowerCase().includes(q)||ds||folders.filter(f=>f.parent===id).some(k=>descendants(k.id,q))}function sub(f,q){let kids=folders.filter(x=>x.parent===f.id).filter(x=>!q||descendants(x.id,q)),show=!q||descendants(f.id,q);if(!show)return'';return `<div class="subboard"><div class="subhead"><span class="subname">└ ${E(f.name)}</span><button class="mini" data-sub="${f.id}">＋項目</button></div>${tiles(f.id,q)}${kids.length?`<div class="subboards">${kids.map(k=>sub(k,q)).join('')}</div>`:''}</div>`}function board(f,q){if(q&&!descendants(f.id,q))return'';let kids=folders.filter(x=>x.parent===f.id).filter(x=>!q||descendants(x.id,q));return `<section class="board"><div class="boardhead"><span class="boardname">📁 ${E(f.name)}</span><button class="mini" data-sub="${f.id}">＋項目</button></div>${tiles(f.id,q)}${kids.length?`<div class="subboards">${kids.map(k=>sub(k,q)).join('')}</div>`:''}</section>`}function render(){clean();let q=$('#q').value.trim().toLowerCase(),roots=folders.filter(f=>f.parent==null),loose=docs.filter(d=>!d.folderId&&(!q||d.title.toLowerCase().includes(q)));$('#app').innerHTML=`<div class="boards">${roots.map(f=>board(f,q)).join('')}</div>`+(loose.length?`<div class="rootdocs">${tiles(null,q)}</div>`:'')+(!roots.length&&!loose.length?'<div class="empty">「＋項目」で項目を作成</div>':'')}function addFolder(parent){targetParent=parent;$('#fn').value='';$('#fd').showModal()}$('#rootAdd').onclick=()=>addFolder(null);$('#fc').onclick=()=>$('#fd').close();$('#ff').onsubmit=async e=>{e.preventDefault();let n=$('#fn').value.trim();if(n){await put('folders',{id:crypto.randomUUID(),name:n,parent:targetParent});folders=await all('folders');$('#fd').close();render()}};function pickFiles(folder){targetFolder=folder==='root'?null:folder;$('#files').click()}$('#rootDoc').onclick=()=>pickFiles(null);$('#files').onchange=async()=>{for(let f of [...$('#files').files]){let img=f.type.startsWith('image/'),b=img?await comp(f):f;await put('docs',{id:crypto.randomUUID(),title:f.name.replace(/\.[^.]+$/,''),folderId:targetFolder,blob:b,type:img?'image':'pdf',size:b.size})}$('#files').value='';docs=await all('docs');render()};document.onclick=e=>{let t=e.target.closest('[data-file],[data-sub],[data-d]');if(!t)return;if(t.dataset.file)pickFiles(t.dataset.file);else if(t.dataset.sub)addFolder(t.dataset.sub);else if(t.dataset.d)openDoc(t.dataset.d)};function comp(f){return new Promise((o,e)=>{let i=new Image,x=URL.createObjectURL(f);i.onload=()=>{let s=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(x);b?o(b):e()},'image/jpeg',.78)};i.onerror=e;i.src=x})}function openDoc(id){let d=docs.find(x=>x.id===id),x=URL.createObjectURL(d.blob);$('#viewer').dataset.url=x;$('#viewer').dataset.id=id;$('#vt').textContent=d.title;$('#viewer').style.display='flex';if(d.type==='image'){$('#vi').src=x;$('#vi').hidden=false;$('#vp').hidden=true}else{$('#vp').src=x;$('#vp').hidden=false;$('#vi').hidden=true}}$('#vc').onclick=()=>{URL.revokeObjectURL($('#viewer').dataset.url);$('#vp').src='about:blank';$('#vi').src='';$('#viewer').style.display='none'};$('#vs').onclick=async()=>{let d=docs.find(x=>x.id===$('#viewer').dataset.id),f=new File([d.blob],d.title+(d.type==='image'?'.jpg':'.pdf'),{type:d.blob.type});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]})};$('#q').oninput=render;let b64=async b=>{let a=new Uint8Array(await b.arrayBuffer()),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)},ub=(s,t)=>{let z=atob(s),a=new Uint8Array(z.length);for(let i=0;i<z.length;i++)a[i]=z.charCodeAt(i);return new Blob([a],{type:t})};$('#tr').onclick=()=>{$('#stats').textContent=`項目 ${folders.length} / 資料 ${docs.length}`;$('#td').showModal()};$('#tc').onclick=()=>$('#td').close();$('#ex').onclick=async()=>{let a=[];$('#st').textContent='作成中…';for(let d of docs)a.push({...d,blob:undefined,data:await b64(d.blob),mime:d.blob.type});let f=new File([JSON.stringify({app:'shiryoko',version:2,folders,docs:a})],`資料庫_${new Date().toISOString().slice(0,10)}.shiryoko`,{type:'application/json'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else{let x=URL.createObjectURL(f),a=document.createElement('a');a.href=x;a.download=f.name;a.click()}$('#st').textContent='完了'};$('#im').onclick=()=>$('#imp').click();$('#imp').onchange=async()=>{try{let x=JSON.parse(await $('#imp').files[0].text());for(let f of x.folders||[])await put('folders',f);for(let d of x.docs||[]){d.blob=ub(d.data,d.mime||'application/pdf');delete d.data;delete d.mime;await put('docs',d)}await load();$('#st').textContent='読み込み完了'}catch(e){alert('読み込みできませんでした')}};(async()=>{db=await odb();await load();navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')})();</script></body></html>
