<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>PDF資料庫</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 14px}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.72;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:16px 16px 100px}.search{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;box-shadow:0 1px 5px #0001}.row{display:flex;gap:10px;align-items:center}.section{margin:20px 0 10px;font-weight:800}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat,.card{background:#fff;border:0;border-radius:16px;padding:16px;text-align:left;box-shadow:0 1px 4px #00000010}.cat b{display:block;font-size:16px}.cat small,.muted{color:#6b7280}.list{display:grid;gap:9px}.card{display:flex;gap:12px;align-items:center;padding:13px}.pdficon{width:42px;height:48px;border-radius:9px;background:#fee2e2;color:#b91c1c;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}.meta{min-width:0;flex:1}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:12px;color:#6b7280;margin-top:3px}.star{border:0;background:none;font-size:22px}.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#111827;color:#fff;padding:15px 19px;font-size:15px;font-weight:800;box-shadow:0 5px 20px #0004}dialog{border:0;border-radius:20px;width:min(92vw,520px);padding:0}dialog::backdrop{background:#0008}.dlg{padding:20px}.dlg h2{margin:0 0 16px}.dlg input,.dlg select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800}.primary{background:#111827;color:#fff}.ghost{background:#e5e7eb}.danger{color:#b91c1c}.empty{text-align:center;color:#6b7280;padding:35px 10px}.back{border:0;background:none;font-size:14px;padding:0;color:#374151}.pill{font-size:11px;background:#e5e7eb;border-radius:999px;padding:3px 7px}#viewer{position:fixed;inset:0;background:#111827;z-index:20;display:none;flex-direction:column}#viewerBar{padding:max(10px,env(safe-area-inset-top)) 10px 10px;color:#fff;display:flex;align-items:center;gap:10px}#viewer iframe{border:0;background:#fff;flex:1;width:100%}.vbtn{border:0;border-radius:9px;padding:9px 12px}.grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{background:#eef2ff;color:#3730a3;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:12px}
</style></head><body><header><h1>PDF資料庫</h1><div class="sub">この端末だけに保存・すぐ開く</div></header><main class="wrap"><input id="search" class="search" placeholder="資料名・ジャンルを検索"><div id="breadcrumb"></div><div id="content"></div></main><button class="fab" id="add">＋ PDF追加</button>
<dialog id="dlg"><form class="dlg" id="form"><h2>PDFを追加</h2><label>PDFファイル</label><input id="file" type="file" accept="application/pdf" required><label>表示名</label><input id="title" placeholder="未入力ならファイル名"><label>ジャンル</label><input id="category" list="catlist" placeholder="例：業務資料" required><datalist id="catlist"></datalist><label>サブジャンル</label><input id="subcat" placeholder="例：パソコン"><div class="notice">PDF本体はGitHubへ送信せず、このブラウザのIndexedDBに保存します。PDFはすでに圧縮済みの形式が多いため、画質を壊す再圧縮は行わず、一覧・履歴などのデータを最小限にして軽量動作します。</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn ghost" id="cancel">閉じる</button><button class="btn primary">保存</button></div></form></dialog>
<div id="viewer"><div id="viewerBar"><button class="vbtn" id="closev">← 戻る</button><b class="grow" id="vtitle"></b><button class="vbtn" id="sharev">共有</button></div><iframe id="frame"></iframe></div>
<script>
const DB='pdf-local-library-v1',STORE='docs';let db,all=[],view={cat:null,sub:null};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function load(){return new Promise((ok,no)=>{let r=tx().getAll();r.onsuccess=()=>{all=r.result.sort((a,b)=>b.lastOpened-a.lastOpened);render();ok()};r.onerror=()=>no(r.error)})}
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const size=n=>n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
function render(){let q=document.querySelector('#search').value.trim().toLowerCase(),c=document.querySelector('#content'),bc=document.querySelector('#breadcrumb');let docs=all.filter(x=>!q||[x.title,x.category,x.subcat].join(' ').toLowerCase().includes(q));document.querySelector('#catlist').innerHTML=[...new Set(all.map(x=>x.category))].map(x=>`<option value="${esc(x)}">`).join('');
if(q){bc.innerHTML='';c.innerHTML='<div class="section">検索結果</div>'+cards(docs);return}
if(!view.cat){bc.innerHTML='';let cats=[...new Set(docs.map(x=>x.category))];let fav=docs.filter(x=>x.favorite);c.innerHTML=(fav.length?'<div class="section">★ よく使う資料</div>'+cards(fav.slice(0,4)):'')+'<div class="section">ジャンル</div><div class="cats">'+cats.map(x=>`<button class="cat" data-cat="${esc(x)}"><b>📁 ${esc(x)}</b><small>${docs.filter(d=>d.category===x).length}件</small></button>`).join('')+'</div>'+(docs.length?'<div class="section">最近使った資料</div>'+cards(docs.slice(0,5)):'<div class="empty">まだPDFがありません。<br>右下の「＋ PDF追加」から登録できます。</div>');}
else if(!view.sub){bc.innerHTML=`<div class="section"><button class="back" data-home>← ジャンル一覧</button></div>`;let ds=docs.filter(x=>x.category===view.cat),subs=[...new Set(ds.map(x=>x.subcat||'その他'))];c.innerHTML=`<h2>${esc(view.cat)}</h2><div class="cats">`+subs.map(x=>`<button class="cat" data-sub="${esc(x)}"><b>📂 ${esc(x)}</b><small>${ds.filter(d=>(d.subcat||'その他')===x).length}件</small></button>`).join('')+'</div>'+(subs.length===1?'<div class="section">資料</div>'+cards(ds):'');}
else{bc.innerHTML=`<div class="section"><button class="back" data-cat="${esc(view.cat)}">← ${esc(view.cat)}</button></div>`;let ds=docs.filter(x=>x.category===view.cat&&(x.subcat||'その他')===view.sub);c.innerHTML=`<h2>${esc(view.sub)}</h2>`+cards(ds)}}
function cards(ds){return ds.length?'<div class="list">'+ds.map(x=>`<div class="card" data-open="${x.id}"><div class="pdficon">PDF</div><div class="meta"><div class="name">${esc(x.title)}</div><div class="tiny">${esc(x.category)}${x.subcat?' › '+esc(x.subcat):''} ・ ${size(x.size)}</div></div><button class="star" data-star="${x.id}">${x.favorite?'★':'☆'}</button><button class="star danger" data-del="${x.id}">⋯</button></div>`).join('')+'</div>':'<div class="empty">資料がありません</div>'}
document.addEventListener('click',async e=>{let el=e.target.closest('[data-cat],[data-sub],[data-home],[data-open],[data-star],[data-del]');if(!el)return;if(el.dataset.home!==undefined){view={cat:null,sub:null};render()}else if(el.dataset.cat){view={cat:el.dataset.cat,sub:null};render()}else if(el.dataset.sub){view.sub=el.dataset.sub;render()}else if(el.dataset.star){e.stopPropagation();let x=all.find(d=>d.id===el.dataset.star);x.favorite=!x.favorite;tx('readwrite').put(x);render()}else if(el.dataset.del){e.stopPropagation();let x=all.find(d=>d.id===el.dataset.del);if(confirm(`「${x.title}」をこの端末から削除しますか？`)){tx('readwrite').delete(x.id);await load()}}else if(el.dataset.open)openPdf(el.dataset.open)});
async function openPdf(id){let x=all.find(d=>d.id===id);x.lastOpened=Date.now();tx('readwrite').put(x);let url=URL.createObjectURL(x.blob);frame.src=url;vtitle.textContent=x.title;viewer.style.display='flex';viewer.dataset.url=url;viewer.dataset.id=id}
closev.onclick=()=>{frame.src='about:blank';URL.revokeObjectURL(viewer.dataset.url);viewer.style.display='none';load()};sharev.onclick=async()=>{let x=all.find(d=>d.id===viewer.dataset.id),f=new File([x.blob],x.title+'.pdf',{type:'application/pdf'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:x.title});else alert('このブラウザではファイル共有に対応していません')};
add.onclick=()=>dlg.showModal();cancel.onclick=()=>dlg.close();file.onchange=()=>{if(!title.value)title.value=file.files[0]?.name.replace(/\.pdf$/i,'')||''};form.onsubmit=async e=>{e.preventDefault();let f=file.files[0];if(!f)return;let item={id:crypto.randomUUID(),title:title.value.trim()||f.name.replace(/\.pdf$/i,''),category:category.value.trim(),subcat:subcat.value.trim(),size:f.size,blob:f,favorite:false,created:Date.now(),lastOpened:Date.now()};tx('readwrite').put(item).onsuccess=async()=>{form.reset();dlg.close();view={cat:null,sub:null};await load()}};search.oninput=render;
(async()=>{db=await openDB();await load();if(navigator.storage?.persist)navigator.storage.persist();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')})();
</script></body></html>
